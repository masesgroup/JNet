# This is a basic workflow to help you get started with Actions

name: Performance workflow

# Controls when the action will run. Triggers the workflow on push
# events but only for the master branch
on:
  workflow_dispatch:
    inputs:
        
concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

# This workflow contains multiple jobs
jobs: 
  # Now run "build"
  build:
    # The type of runner that the job will run on
    runs-on: windows-2022

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:   
      # Runs a set of commands using the runners shell
      # Support longpaths
      - name: Support long paths
        run: git config --system core.longpaths true
      
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6
        with:
          fetch-depth: '1'
          submodules: 'true'

      - name: Pre compile
        run: dotnet build --no-incremental --configuration Release /p:Platform="Any CPU" /p:NoWarn="0108%3B1030%3B0618%3B0612" src\net\JNet\JNet.csproj
        env:
          GITHUB_SIMPLIFIED_GENERATION: true
          
      - name: Set up Apache Maven Central
        uses: actions/setup-java@v5
        with: # running setup-java again overwrites the settings.xml
          distribution: temurin
          java-version: 8
          cache: 'maven'

      - name: Create Jars for JNet
        run: mvn --file ./src/jvm/jnet/pom.xml --no-transfer-progress package
        
      - uses: nuget/setup-nuget@v4
        with:
          nuget-version: '5.x'

      - name: Create Jars for tests
        run: mvn --file ./tests/jvm/jnettest/pom.xml --no-transfer-progress package

      - name: Compile tests and templates
        run: dotnet build --no-incremental --configuration Release /p:Platform="Any CPU" /p:NoWarn="0108%3B1030%3B0618%3B0612" tests\net\JNetTest.sln
        env:
          GITHUB_TEST_PREPARATION: true

      - name: Prepare execution files
        run: |
          Copy-Item ${{ github.workspace }}\tests\scripts\JNetPSTest.ps1 -Destination bin\JNetPSTest.ps1 -Force

      - name: Save JNet bin in cache
        uses: actions/cache/save@v5
        with:
          enableCrossOsArchive: true
          path: ./bin/
          key: JNet_${{ github.run_number }}_${{ github.run_attempt }}_bin_${{ github.sha }}
          
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: JNetBin
          path: .\bin\

  tests_performance:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-22.04', 'ubuntu-22.04-arm' ]
        framework: [ 'net8.0', 'net10.0' ]
        jdk_vendor: [ 'temurin' ]
        jdk_version: [ '17', '25' ]
        run: [ 1, 2, 3, 4, 5 ]
              
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_DbgEnableMiniDump: ${{ inputs.EnableProcessDump }}
      DOTNET_DbgMiniDumpType: ${{ inputs.ProcessDumpType }}
      DOTNET_DbgMiniDumpName: ${{ github.workspace }}/coredump.%p
      DOTNET_CreateDumpDiagnostics: ${{ inputs.EnableProcessDump }}
      DOTNET_CreateDumpVerboseDiagnostics: ${{ inputs.EnableVerboseDiagnosticProcessDump }}
      DOTNET_EnableCrashReport: ${{ inputs.EnableProcessDump }}
      DOTNET_CreateDumpLogToFile: ${{ github.workspace }}/coredump.diagnostic
      JCOBRIDGE_LicensePath: ${{ secrets.JCOBRIDGE_ENCODED_2_6_9 }}
    
    steps:     
      - name: Restore JNet bin from cache
        uses: actions/cache/restore@v5
        with:
          fail-on-cache-miss: true
          enableCrossOsArchive: true
          path: ./bin/
          key: JNet_${{ github.run_number }}_${{ github.run_attempt }}_bin_${{ github.sha }}

      - name: Set up JDK distribution
        if: ${{ matrix.jdk_vendor != 'graalvm' && matrix.jdk_version != '8' }}
        uses: actions/setup-java@v5
        with: # running setup-java again overwrites the settings.xml
          distribution: ${{ matrix.jdk_vendor }}
          java-version: ${{ matrix.jdk_version }}

      - name: Set up JDK distribution
        if: ${{ matrix.jdk_vendor != 'graalvm' && matrix.jdk_version == '8' }}
        uses: actions/setup-java@v5
        with: # running setup-java again overwrites the settings.xml
          distribution: ${{ matrix.jdk_vendor }}
          java-version: ${{ matrix.jdk_version }}
          java-package: jre

      - name: Set up GraalVM distribution
        if: ${{ matrix.jdk_vendor == 'graalvm' }}
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '${{ matrix.jdk_version }}' # See 'Options' for more details
          distribution: 'graalvm' # See 'Supported distributions' for available options
          github-token: ${{ secrets.GITHUB_TOKEN_INHERITED }}

      - name: Full system info (CPU + load)
        shell: bash
        run: |
          echo "===== CPU INFO ====="
          echo "Model:"
          lscpu | grep "Model name" || true
          echo "Architecture:"
          lscpu | grep "Architecture" || true
          echo "Cores:"
          lscpu | grep "^CPU(s):" || true
          echo "Frequency:"
          lscpu | grep -E "MHz|GHz" || echo "Not available"
          echo ""
          echo "===== PERFORMANCE DEBUG ====="
          echo "Load average:"
          cat /proc/loadavg
          echo ""
          echo "CPU governor:"
          cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor 2>/dev/null || echo "Not available"
          echo ""
          echo "CPU scaling current freq:"
          cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_cur_freq 2>/dev/null || echo "Not available"
          echo ""
          echo "Steal time (virtualization hint):"
          top -bn1 | grep "%Cpu" || true
          echo ""
          echo "============================="

      - name: Install bc
        run: sudo apt-get update && sudo apt-get install -y bc

      - name: Run benchmark and machine filter
        shell: bash
        run: |
          OUTPUT=$(dotnet ./bin/${{ matrix.framework }}/JNetPerformanceTest.dll)
          echo "$OUTPUT"
          TOTAL=$(echo "$OUTPUT" | grep "All tests completed in" | awk '{print $5}')
          SECONDS_TOTAL=$(echo "$TOTAL" | awk -F: '{ 
            split($3, s, "."); 
            print ($1 * 3600) + ($2 * 60) + s[1] + ("0." s[2]); 
          }')
          THRESHOLD=20
          if (( $(echo "$SECONDS_TOTAL < $THRESHOLD" | bc -l) )); then
            echo "🚀 FAST ($SECONDS_TOTAL s) | OS=${{ matrix.os }} | FW=${{ matrix.framework }} | JDK=${{ matrix.jdk_vendor }}-${{ matrix.jdk_version }} | RUN=${{ matrix.run }}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          CPU_MODEL=$(lscpu | awk -F: '/Model name|Model:/ {print $2}' | sed 's/^ *//' | head -1)
          CPU_CORES=$(nproc)
          LOAD=$(cut -d ' ' -f1 /proc/loadavg)

          echo "$SECONDS_TOTAL|OS=${{ matrix.os }}|FW=${{ matrix.framework }}|JDK=${{ matrix.jdk_vendor }}-${{ matrix.jdk_version }}|RUN=${{ matrix.run }}|CPU=$CPU_MODEL|CORES=$CPU_CORES|LOAD=$LOAD" > result.txt

      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.os }}-${{ matrix.framework }}-${{ matrix.jdk_version }}-${{ matrix.run }}
          path: result.txt

  collect_results:
    needs: tests_performance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4

      - name: Sort results with hardware info
        run: |
          echo "=== SORTED RESULTS ==="

          cat */result.txt > all.txt

          sort -n all.txt | while IFS="|" read time os fw jdk run cpu cores load; do
            MSG="🚀 $time s | $os | $fw | $jdk | $run | $cpu | cores=$cores | load=$load"

            echo "$MSG"
            echo "$MSG" >> $GITHUB_STEP_SUMMARY
          done


  final_cleanup:
    needs: [ collect_results ]
    if: "always()"
    runs-on: ubuntu-latest
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6
        with:
          fetch-depth: '1'

      - name: Clear caches
        run: |
          gh extension install actions/gh-actions-cache
          echo "Fetching list of cache key"
          cacheKeysForPR=$(gh actions-cache list --key JNet_${{ github.run_number }}_${{ github.run_attempt }} | cut -f 1 )
          ## Setting this to not fail the workflow while deleting cache keys.
          set +e
          echo "Deleting caches..."
          for cacheKey in $cacheKeysForPR
          do
              gh actions-cache delete $cacheKey --confirm
          done
          echo "Done"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN_INHERITED }}
