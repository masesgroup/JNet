name: Benchmark baseline and history

on:
  push:
    branches: [master]
    paths:
      - 'src/net/**'
      - 'src/jvm/jnet/**'
      - 'tests/net/JNetBenchmarksTest/**'
      - 'tests/jvm/jnettest/**'
      - '.github/workflows/benchmark-baseline.yaml'
      - '.github/workflows/build_benchmarks.yaml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      UseSpecialSettings:
        required: false
        default: false
        type: boolean
      SpecialSettingsSource:
        required: false
        default: 'source.zip'
        type: string
      EnableAdvancedTestLogging:
        required: false
        default: false
        type: boolean
      BdnFullSweep:
        description: 'Run the full BulkTransfer parameter sweep (all Length/ForceRawMemory/UseCriticalMethods combinations) instead of the reduced representative set. Only affects benchmark_bulk.'
        required: false
        default: false
        type: boolean

concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build_benchmarks.yaml
    with:
      cache-key-suffix: history
      UseSpecialSettings: ${{ inputs.UseSpecialSettings || false }}
      SpecialSettingsSource: ${{ inputs.SpecialSettingsSource || 'source.zip' }}
    secrets: inherit
  
  prepare_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        shell: bash
        run: |
          # NOTE: windows-latest and net462 temporarily excluded due to
          # MSB4066 (xmlns in <LangVersion>) in BenchmarkDotNet's
          # auto-generated project on Windows - under investigation,
          # unrelated to the InProcessEmitToolchain issue (already reverted).
          matrix=$(cat <<'EOF'
          {
            "os": ["ubuntu-22.04","ubuntu-22.04-arm","ubuntu-24.04","ubuntu-24.04-arm"],
            "framework": ["net10.0", "net11.0"],
            "jdk_vendor": ["temurin", "zulu", "microsoft", "corretto", "oracle", "graalvm"],
            "jdk_version": ["11", "17", "21", "25"],
            "exclude": [
              { "jdk_vendor": "corretto", "jdk_version": "8" },
              { "jdk_vendor": "microsoft", "jdk_version": "8" },
              { "jdk_vendor": "oracle", "jdk_version": "8" },
              { "jdk_vendor": "oracle", "jdk_version": "11" },
              { "jdk_vendor": "graalvm", "jdk_version": "8" },
              { "jdk_vendor": "graalvm", "jdk_version": "11" }
            ]
          }
          EOF
          )
          echo "matrix=$(echo "$matrix" | jq -c .)" >> "$GITHUB_OUTPUT"

  benchmark:
    needs: [build, prepare_matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare_matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      LABEL: ${{ matrix.os }}_${{ matrix.framework }}_${{ matrix.jdk_vendor }}_${{ matrix.jdk_version }}
      JCOBRIDGE_LicensePath: ${{ secrets.JCOBRIDGE_ENCODED_2_6_10 }}
      ENABLE_ADVANCED_TEST_LOGGING: ${{ inputs.EnableAdvancedTestLogging }}
    steps:
      - uses: actions/checkout@v7

      - name: Restore bin from cache
        uses: actions/cache/restore@v6
        with:
          fail-on-cache-miss: true
          enableCrossOsArchive: true
          path: ./bin/
          key: ${{ needs.build.outputs.cache-key }}

      - name: Restore jars for BDN rebuild
        shell: bash
        run: |
          mkdir -p jars
          cp -r bin/${{ matrix.framework }}/jars/. jars/
          ls -la jars/

      - name: Set up JDK distribution
        if: ${{ matrix.jdk_vendor != 'graalvm' && matrix.jdk_version != '8' }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.jdk_vendor }}
          java-version: ${{ matrix.jdk_version }}

      - name: Set up JDK distribution (JRE 8)
        if: ${{ matrix.jdk_vendor != 'graalvm' && matrix.jdk_version == '8' }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.jdk_vendor }}
          java-version: ${{ matrix.jdk_version }}
          java-package: jre

      - name: Set up GraalVM distribution
        if: ${{ matrix.jdk_vendor == 'graalvm' && matrix.jdk_version != '17' }}
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '${{ matrix.jdk_version }}'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up GraalVM distribution
        if: ${{ matrix.jdk_vendor == 'graalvm' && matrix.jdk_version == '17' }}
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17.0.12' # see https://github.com/marketplace/actions/github-action-for-graalvm#notes-on-oracle-graalvm-for-jdk-17
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@v6
        if: ${{ matrix.framework == 'net11.0' }}
        with:
          dotnet-version: '11.x'

      - name: Run benchmarks
        run: |
          dotnet ./bin/${{ matrix.framework }}/JNetBenchmarksTest.dll --exporters json fulljson github --artifacts ./results/core/${{ env.LABEL }} --anyCategories=Core

      - name: Check benchmark results
        shell: bash
        run: |
          dir=results/core/${{ env.LABEL }}
          failed=0

          n=$(ls $dir/results/*-report-full.json 2>/dev/null | wc -l)
          if [ "$n" -eq 0 ]; then
            echo "::error::No benchmark reports produced"
            failed=1
          fi

          if grep -l '"Statistics": null' $dir/results/*.json 2>/dev/null; then
            echo "::error::Failed benchmarks detected (Statistics: null)"
            failed=1
          fi

          if grep -qE "No Workload Results were obtained|exited with code [1-9]" $dir/BenchmarkRun-*.log 2>/dev/null; then
            echo "::error::Benchmark process failed, reasons below"
            grep -hE "Exception|Unable|not available" $dir/BenchmarkRun-*.log | grep -v "Error :" | sort | uniq -c | sort -rn | head -20
            failed=1
          fi

          exit $failed

      - uses: actions/upload-artifact@v7
        with:
          name: bdn-results-core-${{ env.LABEL }}
          path: results/core/${{ env.LABEL }}/results/*-report-full*.json
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: bdn-md-core-${{ env.LABEL }}
          path: results/core/${{ env.LABEL }}/results/*-report-github.md
          retention-days: 14

  benchmark_bulk:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # Reduced matrix: memory-copy throughput depends mostly on
        # OS/.NET/hardware, much less on JDK vendor/version - the full
        # JDK sweep isn't worth its cost here.
        os: ["ubuntu-22.04","ubuntu-22.04-arm","ubuntu-24.04","ubuntu-24.04-arm"]
        framework: ['net10.0', 'net11.0']
        jdk_vendor: ['temurin']
        jdk_version: ['17']
    runs-on: ${{ matrix.os }}
    env:
      LABEL: ${{ matrix.os }}_${{ matrix.framework }}_${{ matrix.jdk_vendor }}_${{ matrix.jdk_version }}
      JCOBRIDGE_LicensePath: ${{ secrets.JCOBRIDGE_ENCODED_2_6_10 }}
      ENABLE_ADVANCED_TEST_LOGGING: ${{ inputs.EnableAdvancedTestLogging }}
      BDN_FULL_SWEEP: ${{ (inputs.BdnFullSweep == true) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7

      - name: Restore bin from cache
        uses: actions/cache/restore@v6
        with:
          fail-on-cache-miss: true
          enableCrossOsArchive: true
          path: ./bin/
          key: ${{ needs.build.outputs.cache-key }}

      - name: Restore jars for BDN rebuild
        shell: bash
        run: |
          mkdir -p jars
          cp -r bin/${{ matrix.framework }}/jars/. jars/
          ls -la jars/

      - name: Set up JDK distribution
        uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.jdk_vendor }}
          java-version: ${{ matrix.jdk_version }}

      - uses: actions/setup-dotnet@v6
        if: ${{ matrix.framework == 'net11.0' }}
        with:
          dotnet-version: '11.x'

      - name: Run benchmarks
        run: |
          dotnet ./bin/${{ matrix.framework }}/JNetBenchmarksTest.dll --exporters json fulljson github --artifacts ./results/bulk/${{ env.LABEL }} --anyCategories=BulkTransfer

      - name: Check benchmark results
        shell: bash
        run: |
          dir=results/bulk/${{ env.LABEL }}
          failed=0

          n=$(ls $dir/results/*-report-full.json 2>/dev/null | wc -l)
          if [ "$n" -eq 0 ]; then
            echo "::error::No benchmark reports produced"
            failed=1
          fi

          if grep -l '"Statistics": null' $dir/results/*.json 2>/dev/null; then
            echo "::error::Failed benchmarks detected (Statistics: null)"
            failed=1
          fi

          if grep -qE "No Workload Results were obtained|exited with code [1-9]" $dir/BenchmarkRun-*.log 2>/dev/null; then
            echo "::error::Benchmark process failed, reasons below"
            grep -hE "Exception|Unable|not available" $dir/BenchmarkRun-*.log | grep -v "Error :" | sort | uniq -c | sort -rn | head -20
            failed=1
          fi

          exit $failed

      - uses: actions/upload-artifact@v7
        with:
          name: bdn-results-bulk-${{ env.LABEL }}
          path: results/bulk/${{ env.LABEL }}/results/*-report-full*.json
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: bdn-md-bulk-${{ env.LABEL }}
          path: results/bulk/${{ env.LABEL }}/results/*-report-github.md
          retention-days: 14

  publish_history:
    if: ${{ inputs.UseSpecialSettings != true }}
    needs: [benchmark, prepare_matrix]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare_matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    env:
      LABEL: ${{ matrix.os }}_${{ matrix.framework }}_${{ matrix.jdk_vendor }}_${{ matrix.jdk_version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bdn-results-core-${{ env.LABEL }}
          path: results/${{ env.LABEL }}/results

      - name: Publish ArrayVarArgsBenchmarks
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'JNet ArrayVarArgsBenchmarks (${{ env.LABEL }})'
          tool: 'benchmarkdotnet'
          output-file-path: results/${{ env.LABEL }}/results/MASES.JNetBenchmarksTest.ArrayVarArgsBenchmarks-report-full-compressed.json
          gh-repository: 'github.com/masesgroup/benchmark-data'
          gh-pages-branch: master
          benchmark-data-dir-path: jnet/${{ matrix.os }}/${{ matrix.framework }}/${{ matrix.jdk_vendor }}/${{ matrix.jdk_version }}
          github-token: ${{ secrets.WORKFLOW_PERMISSION_PAT }}
          auto-push: true
          alert-threshold: '150%'
          fail-on-alert: false

      - name: Clean benchmark repository directory
        shell: bash
        run: rm -rf ./benchmark-data-repository

      - name: Publish InvokeBenchmarks
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'JNet InvokeBenchmarks (${{ env.LABEL }})'
          tool: 'benchmarkdotnet'
          output-file-path: results/${{ env.LABEL }}/results/MASES.JNetBenchmarksTest.InvokeBenchmarks-report-full-compressed.json
          gh-repository: 'github.com/masesgroup/benchmark-data'
          gh-pages-branch: master
          benchmark-data-dir-path: jnet/${{ matrix.os }}/${{ matrix.framework }}/${{ matrix.jdk_vendor }}/${{ matrix.jdk_version }}
          github-token: ${{ secrets.WORKFLOW_PERMISSION_PAT }}
          auto-push: true
          alert-threshold: '150%'
          fail-on-alert: false

      - name: Clean benchmark repository directory
        shell: bash
        run: rm -rf ./benchmark-data-repository

      - name: Publish PredicateRoundTripBenchmarks
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'JNet PredicateRoundTripBenchmarks (${{ env.LABEL }})'
          tool: 'benchmarkdotnet'
          output-file-path: results/${{ env.LABEL }}/results/MASES.JNetBenchmarksTest.PredicateRoundTripBenchmarks-report-full-compressed.json
          gh-repository: 'github.com/masesgroup/benchmark-data'
          gh-pages-branch: master
          benchmark-data-dir-path: jnet/${{ matrix.os }}/${{ matrix.framework }}/${{ matrix.jdk_vendor }}/${{ matrix.jdk_version }}
          github-token: ${{ secrets.WORKFLOW_PERMISSION_PAT }}
          auto-push: true
          alert-threshold: '150%'
          fail-on-alert: false

      - name: Clean benchmark repository directory
        shell: bash
        run: rm -rf ./benchmark-data-repository

      - name: Publish PredicateSustainedBenchmarks
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'JNet PredicateSustainedBenchmarks (${{ env.LABEL }})'
          tool: 'benchmarkdotnet'
          output-file-path: results/${{ env.LABEL }}/results/MASES.JNetBenchmarksTest.PredicateSustainedBenchmarks-report-full-compressed.json
          gh-repository: 'github.com/masesgroup/benchmark-data'
          gh-pages-branch: master
          benchmark-data-dir-path: jnet/${{ matrix.os }}/${{ matrix.framework }}/${{ matrix.jdk_vendor }}/${{ matrix.jdk_version }}
          github-token: ${{ secrets.WORKFLOW_PERMISSION_PAT }}
          auto-push: true
          alert-threshold: '150%'
          fail-on-alert: false

      - name: Clean benchmark repository directory
        shell: bash
        run: rm -rf ./benchmark-data-repository

      - name: Publish ConstructorBenchmarks
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'JNet ConstructorBenchmarks (${{ env.LABEL }})'
          tool: 'benchmarkdotnet'
          output-file-path: results/${{ env.LABEL }}/results/MASES.JNetBenchmarksTest.ConstructorBenchmarks-report-full-compressed.json
          gh-repository: 'github.com/masesgroup/benchmark-data'
          gh-pages-branch: master
          benchmark-data-dir-path: jnet/${{ matrix.os }}/${{ matrix.framework }}/${{ matrix.jdk_vendor }}/${{ matrix.jdk_version }}
          github-token: ${{ secrets.WORKFLOW_PERMISSION_PAT }}
          auto-push: true
          alert-threshold: '150%'
          fail-on-alert: false

      - name: Clean benchmark repository directory
        shell: bash
        run: rm -rf ./benchmark-data-repository

      - name: Publish FieldBenchmarks
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'JNet FieldBenchmarks (${{ env.LABEL }})'
          tool: 'benchmarkdotnet'
          output-file-path: results/${{ env.LABEL }}/results/MASES.JNetBenchmarksTest.FieldBenchmarks-report-full-compressed.json
          gh-repository: 'github.com/masesgroup/benchmark-data'
          gh-pages-branch: master
          benchmark-data-dir-path: jnet/${{ matrix.os }}/${{ matrix.framework }}/${{ matrix.jdk_vendor }}/${{ matrix.jdk_version }}
          github-token: ${{ secrets.WORKFLOW_PERMISSION_PAT }}
          auto-push: true
          alert-threshold: '150%'
          fail-on-alert: false

      - name: Clean benchmark repository directory
        shell: bash
        run: rm -rf ./benchmark-data-repository

      - name: Publish MultiParamInvokeBenchmarks
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'JNet MultiParamInvokeBenchmarks (${{ env.LABEL }})'
          tool: 'benchmarkdotnet'
          output-file-path: results/${{ env.LABEL }}/results/MASES.JNetBenchmarksTest.MultiParamInvokeBenchmarks-report-full-compressed.json
          gh-repository: 'github.com/masesgroup/benchmark-data'
          gh-pages-branch: master
          benchmark-data-dir-path: jnet/${{ matrix.os }}/${{ matrix.framework }}/${{ matrix.jdk_vendor }}/${{ matrix.jdk_version }}
          github-token: ${{ secrets.WORKFLOW_PERMISSION_PAT }}
          auto-push: true
          alert-threshold: '150%'
          fail-on-alert: false

      - name: Clean benchmark repository directory
        shell: bash
        run: rm -rf ./benchmark-data-repository

      - name: Publish PreallocatedJavaObjectBenchmarks
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'JNet PreallocatedJavaObjectBenchmarks (${{ env.LABEL }})'
          tool: 'benchmarkdotnet'
          output-file-path: results/${{ env.LABEL }}/results/MASES.JNetBenchmarksTest.PreallocatedJavaObjectBenchmarks-report-full-compressed.json
          gh-repository: 'github.com/masesgroup/benchmark-data'
          gh-pages-branch: master
          benchmark-data-dir-path: jnet/${{ matrix.os }}/${{ matrix.framework }}/${{ matrix.jdk_vendor }}/${{ matrix.jdk_version }}
          github-token: ${{ secrets.WORKFLOW_PERMISSION_PAT }}
          auto-push: true
          alert-threshold: '150%'
          fail-on-alert: false

  publish_history_bulk:
    if: ${{ inputs.UseSpecialSettings != true }}
    needs: [benchmark_bulk]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: ["ubuntu-22.04","ubuntu-22.04-arm","ubuntu-24.04","ubuntu-24.04-arm"]
        framework: ['net10.0', 'net11.0']
        jdk_vendor: ['temurin']
        jdk_version: ['17']
    runs-on: ubuntu-latest
    env:
      LABEL: ${{ matrix.os }}_${{ matrix.framework }}_${{ matrix.jdk_vendor }}_${{ matrix.jdk_version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bdn-results-bulk-${{ env.LABEL }}
          path: results/${{ env.LABEL }}/results

      - name: Publish ByteArrayTransferBenchmarks
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'JNet ByteArrayTransferBenchmarks (${{ env.LABEL }})'
          tool: 'benchmarkdotnet'
          output-file-path: results/${{ env.LABEL }}/results/MASES.JNetBenchmarksTest.ByteArrayTransferBenchmarks-report-full-compressed.json
          gh-repository: 'github.com/masesgroup/benchmark-data'
          gh-pages-branch: master
          benchmark-data-dir-path: jnet/${{ matrix.os }}/${{ matrix.framework }}/${{ matrix.jdk_vendor }}/${{ matrix.jdk_version }}
          github-token: ${{ secrets.WORKFLOW_PERMISSION_PAT }}
          auto-push: true
          alert-threshold: '150%'
          fail-on-alert: false

      - name: Clean benchmark repository directory
        shell: bash
        run: rm -rf ./benchmark-data-repository

      - name: Publish ByteBufferTransferBenchmarks
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'JNet ByteBufferTransferBenchmarks (${{ env.LABEL }})'
          tool: 'benchmarkdotnet'
          output-file-path: results/${{ env.LABEL }}/results/MASES.JNetBenchmarksTest.ByteBufferTransferBenchmarks-report-full-compressed.json
          gh-repository: 'github.com/masesgroup/benchmark-data'
          gh-pages-branch: master
          benchmark-data-dir-path: jnet/${{ matrix.os }}/${{ matrix.framework }}/${{ matrix.jdk_vendor }}/${{ matrix.jdk_version }}
          github-token: ${{ secrets.WORKFLOW_PERMISSION_PAT }}
          auto-push: true
          alert-threshold: '150%'
          fail-on-alert: false

  cross_matrix_comparison:
    needs: benchmark
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      ANCHOR: ubuntu-22.04_net10.0_temurin_17
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: downloaded
          pattern: bdn-results-core-*

      - name: Install roll-forward for ResultsComparer (net6.0 EOL)
        run: echo "DOTNET_ROLL_FORWARD=LatestMajor" >> "$GITHUB_ENV"

      - name: Clone ResultsComparer
        run: git clone --depth 1 https://github.com/dotnet/performance.git /tmp/performance

      - name: Compare every cell against the anchor
        shell: bash
        run: |
          mkdir -p cross-comparison-reports
          anchor_dir="downloaded/bdn-results-core-${ANCHOR}"
          if [ ! -d "$anchor_dir" ]; then
            echo "::error::Anchor cell '${ANCHOR}' not found among published results."
            exit 1
          fi

          for dir in downloaded/bdn-results-*/; do
            label=$(basename "$dir" | sed 's/^bdn-results-//')
            [ "$label" = "$ANCHOR" ] && continue

            echo "=== $ANCHOR vs $label ==="
            dotnet run --project /tmp/performance/src/tools/ResultsComparer -- \
              --base "$anchor_dir" \
              --diff "$dir" \
              --threshold 10% \
              --noise 0.3ms \
              --top 999 \
              > "cross-comparison-reports/${ANCHOR}_vs_${label}.txt" 2>&1 || true
          done

      - uses: actions/upload-artifact@v7
        with:
          name: cross-matrix-comparison-reports
          path: cross-comparison-reports/
          retention-days: 30

      - name: Highlight variations in job summary
        shell: bash
        run: |
          {
            echo "## Cross-matrix comparison — anchor: \`${ANCHOR}\`"
            echo ""
            found_any=0
            for f in cross-comparison-reports/*.txt; do
              label=$(basename "$f" .txt | sed "s/^${ANCHOR}_vs_//")

              if grep -q "^No differences found" "$f"; then
                continue
              fi

              found_any=1
              echo "### \`$label\`"
              echo ""
              # summary block (better/worse count, geomean)
              grep -A2 '^summary:' "$f" | head -n3
              echo ""
              # the Faster/Slower markdown table itself, if present
              if grep -qE '^\| Faster' "$f"; then
                echo "**Faster:**"
                echo ""
                awk '/^\| Faster/{p=1} p{print} /^$/{if(p)exit}' "$f"
                echo ""
              fi
              if grep -qE '^\| Slower' "$f"; then
                echo "**Slower:**"
                echo ""
                awk '/^\| Slower/{p=1} p{print} /^$/{if(p)exit}' "$f"
                echo ""
              fi
            done
            if [ "$found_any" -eq 0 ]; then
              echo "_No cell showed a statistically significant deviation from the anchor._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  update_doc:
    needs: benchmark
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with: { path: downloaded }

      - name: Assemble benchmark-latest.md
        run: |
          {
            echo "---"
            echo "title: Benchmark results (latest run)"
            echo "---"
            echo ""
            echo "# Benchmark results"
            echo ""
            echo "Auto-generated by [BenchmarkDotNet](https://benchmarkdotnet.org/) on $(date -u +%Y-%m-%d)."
            echo "Do not edit by hand - this file is fully overwritten on every run."
            echo ""
            echo "Live historical dashboard: https://masesgroup.com/benchmark-data/"
            echo ""
            for f in downloaded/bdn-md-*/*-report-github.md; do
              label=$(basename "$(dirname "$f")" | sed 's/^bdn-md-//')
              echo "## $label"
              echo ""
              cat "$f"
              echo ""
            done
          } > src/documentation/articles/benchmark-latest.md

      - name: Update summary values in README.md and index.md
        shell: bash
        run: |
          set +o pipefail

          LATEST=src/documentation/articles/benchmark-latest.md
          OUT=src/documentation/articles/benchmark-by-cpu.md
          MIN_CELLS=5     # CPU models with fewer matrix cells are left out of the by-CPU page

          # Normalize every table row to TSV:
          # 1 label, 2 method, 3 params, 4 mean, 5 error, 6 stddev, 7 allocated,
          # 8 class (arm64|x86-64-v3|x86-64-v4), 9 cpu, 10 model (cpu without clock)
          ROWS=$(awk -F'|' '
            function trim(s) { gsub(/^[ \t*]+|[ \t*]+$/, "", s); return s }
            function get(name) { return (name in col) ? trim($(col[name])) : "" }
            /^## / { label = trim(substr($0, 4)); arch = ""; isa = ""; cpu = ""; delete col; next }
            /^[^|].*Arm64 RyuJIT/ { arch = "arm64"; next }
            /^[^|].*X64 RyuJIT/ {
              arch = "x64"
              if (match($0, /x86-64-v[0-9]+/)) isa = substr($0, RSTART, RLENGTH)
              next
            }
            /^[^|].*physical core/ {
              cpu = $0; sub(/,.*/, "", cpu)                   # drop ", 4 logical and 2 physical cores"
              sub(/ CPU /, " ", cpu); sub(/ *\(Max:[^)]*\)/, "", cpu)
              sub(/^INTEL XEON PLATINUM/, "Intel Xeon Platinum", cpu)
              cpu = trim(cpu); if (cpu ~ /^Unknown processor/) cpu = "unknown"
              next
            }
            /^\|/ {
              if ($0 ~ /^[|: -]+$/) next                      # separator row
              if ($0 ~ /\| *Method *\|/) {                    # header row
                delete col
                for (i = 2; i < NF; i++) col[trim($i)] = i
                next
              }
              if (!("Mean" in col) || !("Method" in col)) next
              params = ""
              for (i = col["Method"] + 1; i < col["Mean"]; i++)
                params = params (params == "" ? "" : ",") trim($i)
              alloc = get("Allocated"); if (alloc == "-") alloc = "0 B"
              g = arch; if (g == "") g = (label ~ /-arm/) ? "arm64" : "x64"
              if (g == "x64" && isa != "") g = isa
              c = cpu; if (c == "") c = "n/a"
              mdl = c; sub(/ +[0-9.]+GHz.*$/, "", mdl)
              if (g == "arm64") mdl = "arm64"
              printf "%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n", label, get("Method"), params, get("Mean"), get("Error"), get("StdDev"), alloc, g, c, mdl
            }
          ' "$LATEST")

          # pick METHOD [PARAMS_REGEX]   (uses the globals FIELD = 8 class | 10 model, and GROUP)
          # Median and interquartile range (25th-75th percentile, nearest-rank) of the
          # per-run Mean across all matrix cells of the group, sorted on values normalized
          # to ns, plus the best observed run, its cell and its CPU.
          # Values are printed as they appear in the table; Allocated comes from the
          # median row. Prints "median|q1|q3|min|mincell|mincpu|allocated|runs".
          pick() {
            local out
            out=$(awk -F'\t' -v m="$1" -v p="${2:-.*}" -v grp="$GROUP" -v fld="$FIELD" '
              function ns(s,  a, v, u) {
                split(s, a, " "); v = a[1]; gsub(",", "", v); v = v + 0; u = a[2]
                if (u == "ns") return v
                if (u == "ms") return v * 1e6
                if (u == "s")  return v * 1e9
                return v * 1e3                                 # us / μs / µs
              }
              $2 == m && $3 ~ p && $(fld + 0) == grp && $4 ~ /^[0-9]/ { k++; v[k] = ns($4); row[k] = $0 }
              END {
                if (!k) exit
                for (i = 1; i <= k; i++) idx[i] = i
                for (i = 2; i <= k; i++) {                     # insertion sort by Mean in ns
                  t = idx[i]; j = i - 1
                  while (j > 0 && v[idx[j]] > v[t]) { idx[j+1] = idx[j]; j-- }
                  idx[j+1] = t
                }
                split(row[idx[int((k + 1) / 2)]], f,  "\t")
                split(row[idx[int((k + 3) / 4)]], q1, "\t")
                split(row[idx[int((3 * k + 3) / 4)]], q3, "\t")
                split(row[idx[1]], lo, "\t")
                print f[4] "|" q1[4] "|" q3[4] "|" lo[4] "|" lo[1] "|" lo[9] "|" f[7] "|" k
              }
            ' <<< "$ROWS")
            echo "${out:-N/A|N/A|N/A|N/A|N/A|N/A|N/A|0}"
          }

          # cells FIELD GROUP -> number of distinct matrix cells (runs) in the group
          cells() {
            cut -f"1,$1" <<< "$ROWS" | sort -u | awk -F'\t' -v g="$2" '$2 == g' | wc -l | tr -d ' '
          }

          # ---------------------------------------------------------------
          # 1. Summary table for README.md / index.md (CPU classes as columns)
          # ---------------------------------------------------------------
          CLASSES=(arm64 x86-64-v3 x86-64-v4)

          # row "Description" METHOD [PARAMS_REGEX]  -> one markdown table row,
          # one column per CPU class: median, then IQR and best on a second line
          row() {
            local line="| $1" method="$2" params="${3:-.*}" g med q1 q3 min cell cpu al runs
            for g in "${CLASSES[@]}"; do
              GROUP="$g"
              IFS='|' read -r med q1 q3 min cell cpu al runs <<< "$(pick "$method" "$params")"
              if [ "$med" = "N/A" ]; then
                echo "::warning::Could not extract summary values for $method $params ($g)." >&2
                line+=" | n/a"; continue
              fi
              [ "${q1##* }" = "${q3##* }" ] && q1="${q1% *}"   # drop duplicated unit in the IQR
              line+=" | **$med**<br><sub>IQR $q1 – $q3 · best $min</sub>"
            done
            echo "$line |"
          }

          BLOCK=$(
            FIELD=8
            hdr='| Benchmark'; sep='|---'
            for g in "${CLASSES[@]}"; do
              case "$g" in
                arm64)     t="arm64" ;;
                x86-64-v3) t="x64 AVX2 (v3)" ;;
                x86-64-v4) t="x64 AVX-512 (v4)" ;;
                *)         t="$g" ;;
              esac
              hdr+=" | $t, $(cells 8 "$g") runs"; sep+='|---:'
            done
            echo "$hdr |"
            echo "${sep}|"
            row "Sustained JVM→.NET callback (first gate discard)" PredicateSustained '^True,False,False$'
            row "Sustained JVM→.NET callback (full processing)"    PredicateSustained '^True,True,True$'
            row "Static no-arg invocation"                         InvokeStaticEmptyWithSignature
            row "Static invocation with feedback"                  InvokeStaticWithFeedback
            row "Object creation"                                  NewEmpty
            row "Invoke with int[] (10000 elements)"               InvokeIntArrayFixed '^10000$'
            row "Get instance int field"                           GetInstanceIntField
            row "Set instance int field"                           SetInstanceIntField
            row "Get instance string field"                        GetInstanceStringField
            row "Set instance string field"                        SetInstanceStringField
          )

          # Replace everything between the markers, keeping the markers themselves
          # (blank lines around the block so every renderer parses it correctly)
          for f in README.md src/documentation/index.md; do
            awk -v block="$BLOCK" '
              /<!-- BENCHMARK-SUMMARY-START -->/ { print; print ""; print block; print ""; skip=1; next }
              /<!-- BENCHMARK-SUMMARY-END -->/ { skip=0 }
              !skip { print }
            ' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

          # ---------------------------------------------------------------
          # 2. Detail page: one column per CPU model (clock ignored)
          # ---------------------------------------------------------------
          FIELD=10
          mapfile -t MODELS < <(
            cut -f1,10 <<< "$ROWS" | sort -u | cut -f2 | sort | uniq -c | sort -rn |
              awk -v min="$MIN_CELLS" '$1 >= min { sub(/^ *[0-9]+ +/, ""); print }'
          )

          DETAIL_HDR='| Benchmark'; DETAIL_SEP='|---'
          for m in "${MODELS[@]}"; do
            t="$m"; [ "$m" = "arm64" ] && t="arm64 (Neoverse-N2)"
            DETAIL_HDR+=" | $t<br><sub>$(cells 10 "$m") runs</sub>"; DETAIL_SEP+='|---:'
          done
          DETAIL_HDR+=' | Allocated |'; DETAIL_SEP+='|---:|'

          USED=" "

          # params_of METHOD -> distinct params values found in the data (version-sorted)
          params_of() { awk -F'\t' -v m="$1" '$2 == m { print $3 }' <<< "$ROWS" | sort -uV; }

          # detail_row METHOD PARAMS [TITLE] -> one row, one median per CPU model
          detail_row() {
            local method="$1" params="$2" name="${3:-}" line m med q1 q3 min cell cpu al runs alloc=""
            if [ -z "$name" ]; then
              name="\`$method\`"; [ -n "$params" ] && name+=" ($params)"
            fi
            line="| $name"
            for m in "${MODELS[@]}"; do
              FIELD=10; GROUP="$m"
              IFS='|' read -r med q1 q3 min cell cpu al runs <<< "$(pick "$method" "^${params}\$")"
              if [ "$med" = "N/A" ]; then
                line+=" | –"
              else
                line+=" | $med"; [ -z "$alloc" ] && alloc="$al"
              fi
            done
            echo "$line | ${alloc:--} |"
          }

          # detail_section "Title" METHOD...
          detail_section() {
            local title="$1" m p found; shift
            echo "## $title"; echo
            echo "$DETAIL_HDR"; echo "$DETAIL_SEP"
            for m in "$@"; do
              USED+="$m "; found=0
              while IFS= read -r p; do
                found=1; detail_row "$m" "$p"
              done < <(params_of "$m")
              [ "$found" = 0 ] && echo "::warning::Method $m not found in $LATEST." >&2
            done
            echo
          }

          {
            echo "# JNet: benchmark results by CPU model"
            echo
            echo "<!-- Generated by the benchmark workflow from benchmark-latest.md. Do not edit manually. -->"
            echo
            echo "Median of the per-run BenchmarkDotNet Mean across all CI matrix cells (OS, .NET and JDK combinations) that ran on the same CPU model; the clock frequency reported by BenchmarkDotNet is ignored. The number of runs is in each column header. CPU models seen in fewer than $MIN_CELLS cells are omitted. Allocated is the same on every run. Runners reporting an unknown arm64 processor are grouped with arm64."
            echo
            detail_section "JVM object creation"  NewEmpty NewWithSignature DeclaredNewEmpty
            detail_section "Field access"         GetInstanceIntField SetInstanceIntField GetInstanceStringField SetInstanceStringField GetStaticIntField SetStaticIntField GetStaticStringField SetStaticStringField GetInstanceIntFieldGeneric
            detail_section "Method invocation"    InvokeStaticEmpty InvokeStaticEmptyWithSignature InvokeStaticWithFeedback InvokeInstanceEmpty InvokeInstanceWithFeedback
            detail_section "Array and varargs invocation" InvokeIntParam InvokeIntArrayFixed InvokeVarArgsWholeArray InvokeStringArrayFixed InvokeVarArgsSpreadElements InvokeIntArrayFixedSegment InvokeIntArrayFixedSlicedCopy InvokeIntArrayFixedSegmentFull
            detail_section "Preallocated JVM objects" InvokeSingleStringPreallocated InvokeStringArrayPreallocated
            detail_section "Multi-parameter invocation" InvokeMultiParam

            echo "## JVM→.NET callback (sustained)"; echo
            echo "$DETAIL_HDR"; echo "$DETAIL_SEP"
            USED+="PredicateSustained "
            detail_row PredicateSustained "True,False,False"  "by index, first gate discard ¹"
            detail_row PredicateSustained "True,True,False"   "by index, second gate discard ¹"
            detail_row PredicateSustained "True,True,True"    "by index, full processing ¹"
            detail_row PredicateSustained "False,False,False" "by name, first gate discard"
            detail_row PredicateSustained "False,True,False"  "by name, second gate discard"
            detail_row PredicateSustained "False,True,True"   "by name, full processing"
            echo
            echo "¹ \`byIndex = true\` is still simulated on the JVM side."
          } > "$OUT"

          # Methods present in the data but not listed in any section above
          for m in $(cut -f2 <<< "$ROWS" | sort -u); do
            case "$USED" in
              *" $m "*) ;;
              *) echo "::warning::Method $m is in the benchmark data but not in $OUT." >&2 ;;
            esac
          done

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.UseSpecialSettings == true }}
        with:
          name: benchmark-latest
          path: src/documentation/articles/benchmark-latest.md
          retention-days: 7

      - uses: peter-evans/create-pull-request@v8
        if: ${{ inputs.UseSpecialSettings != true }}
        with:
          branch: benchmark-latest-update-${{ github.run_number }}
          commit-message: 'chore(perf): update benchmark-latest.md'
          title: 'Update benchmark-latest.md (run #${{ github.run_number }})'
          add-paths: |
            README.md
            src/documentation/index.md
            src/documentation/articles/benchmark-by-cpu.md
            src/documentation/articles/benchmark-latest.md
          body: |
            Auto-generated benchmark tables from BenchmarkDotNet.
            No changes to performance.md - separate, fully regenerated file.
            Full historical trend: https://masesgroup.com/benchmark-data/
          delete-branch: true
