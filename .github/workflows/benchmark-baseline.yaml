name: Benchmark baseline and history

on:
  push:
    branches: [master]
    paths:
      - 'src/net/**'
      - 'src/jvm/jnet/**'
      - 'tests/net/JNetBenchmarksTest/**'
      - 'tests/jvm/jnettest/**'
      - '.github/workflows/benchmark-baseline.yaml'
      - '.github/workflows/build_benchmarks.yaml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      UseSpecialSettings:
        required: false
        default: false
        type: boolean
      SpecialSettingsSource:
        required: false
        default: 'source.zip'
        type: string
      EnableAdvancedTestLogging:
        required: false
        default: false
        type: boolean

jobs:
  build:
    uses: ./.github/workflows/build_benchmarks.yaml
    with:
      cache-key-suffix: history
      UseSpecialSettings: ${{ inputs.UseSpecialSettings || false }}
      SpecialSettingsSource: ${{ inputs.SpecialSettingsSource || 'source.zip' }}
    secrets: inherit
  
  prepare_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        shell: bash
        run: |
          # NOTE: windows-latest and net462 temporarily excluded due to
          # MSB4066 (xmlns in <LangVersion>) in BenchmarkDotNet's
          # auto-generated project on Windows - under investigation,
          # unrelated to the InProcessEmitToolchain issue (already reverted).
          matrix=$(cat <<'EOF'
          {
            "os": ["ubuntu-22.04","ubuntu-22.04-arm","ubuntu-24.04","ubuntu-24.04-arm"],
            "framework": ["net8.0", "net9.0", "net10.0"],
            "jdk_vendor": ["temurin", "zulu", "microsoft", "corretto", "oracle", "graalvm"],
            "jdk_version": ["11", "17", "21", "25"],
            "exclude": [
              { "jdk_vendor": "corretto", "jdk_version": "8" },
              { "jdk_vendor": "microsoft", "jdk_version": "8" },
              { "jdk_vendor": "oracle", "jdk_version": "8" },
              { "jdk_vendor": "oracle", "jdk_version": "11" },
              { "jdk_vendor": "graalvm", "jdk_version": "8" },
              { "jdk_vendor": "graalvm", "jdk_version": "11" }
            ]
          }
          EOF
          )
          echo "matrix=$(echo "$matrix" | jq -c .)" >> "$GITHUB_OUTPUT"

  benchmark:
    needs: [build, prepare_matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare_matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      LABEL: ${{ matrix.os }}_${{ matrix.framework }}_${{ matrix.jdk_vendor }}_${{ matrix.jdk_version }}
      JCOBRIDGE_LicensePath: ${{ secrets.JCOBRIDGE_ENCODED_2_6_9 }}
      ENABLE_ADVANCED_TEST_LOGGING: ${{ inputs.EnableAdvancedTestLogging }}
    steps:
      - uses: actions/checkout@v7

      - name: Restore bin from cache
        uses: actions/cache/restore@v6
        with:
          fail-on-cache-miss: true
          enableCrossOsArchive: true
          path: ./bin/
          key: ${{ needs.build.outputs.cache-key }}

      - name: Set up JDK distribution
        if: ${{ matrix.jdk_vendor != 'graalvm' && matrix.jdk_version != '8' }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.jdk_vendor }}
          java-version: ${{ matrix.jdk_version }}

      - name: Set up JDK distribution (JRE 8)
        if: ${{ matrix.jdk_vendor != 'graalvm' && matrix.jdk_version == '8' }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.jdk_vendor }}
          java-version: ${{ matrix.jdk_version }}
          java-package: jre

      - name: Set up GraalVM distribution
        if: ${{ matrix.jdk_vendor == 'graalvm' }}
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '${{ matrix.jdk_version }}'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run benchmarks
        run: |
          dotnet ./bin/${{ matrix.framework }}/JNetBenchmarksTest.dll --exporters json github --artifacts ./results/${{ env.LABEL }} --filter '*'

      - name: Fail fast on benchmark issues
        shell: bash
        run: |
          # Search for failed benchmarks in all JSON files inside the folder
          if grep -q '"Statistics": null' results/${{ env.LABEL }}/results/*.json; then
            echo "::error::Detected failed benchmarks (Statistics: null) in the reports!"
            # Show which files contain the error
            grep -l '"Statistics": null' results/${{ env.LABEL }}/*.json
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: bdn-results-${{ env.LABEL }}
          path: results/${{ env.LABEL }}/results/*-report-full*.json
          retention-days: 7

  publish_history:
    needs: [benchmark, prepare_matrix]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare_matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    env:
      LABEL: ${{ matrix.os }}_${{ matrix.framework }}_${{ matrix.jdk_vendor }}_${{ matrix.jdk_version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bdn-results-${{ env.LABEL }}
          path: results/${{ env.LABEL }}/results

      - name: Publish ArrayVarArgsBenchmarks
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'JNet ArrayVarArgsBenchmarks (${{ env.LABEL }})'
          tool: 'benchmarkdotnet'
          output-file-path: results/${{ env.LABEL }}/results/MASES.JNetBenchmarksTest.ArrayVarArgsBenchmarks-report-full-compressed.json
          gh-repository: 'github.com/masesgroup/benchmark-data'
          gh-pages-branch: master
          benchmark-data-dir-path: jnet/${{ env.LABEL }}
          github-token: ${{ secrets.WORKFLOW_PERMISSION_PAT }}
          auto-push: true
          alert-threshold: '150%'
          fail-on-alert: false

      - name: Clean benchmark repository directory
        shell: bash
        run: rm -rf ./benchmark-data-repository

      - name: Publish InvokeBenchmarks
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'JNet InvokeBenchmarks (${{ env.LABEL }})'
          tool: 'benchmarkdotnet'
          output-file-path: results/${{ env.LABEL }}/results/MASES.JNetBenchmarksTest.InvokeBenchmarks-report-full-compressed.json
          gh-repository: 'github.com/masesgroup/benchmark-data'
          gh-pages-branch: master
          benchmark-data-dir-path: jnet/${{ env.LABEL }}
          github-token: ${{ secrets.WORKFLOW_PERMISSION_PAT }}
          auto-push: true
          alert-threshold: '150%'
          fail-on-alert: false

      - name: Clean benchmark repository directory
        shell: bash
        run: rm -rf ./benchmark-data-repository

      - name: Publish PredicateRoundTripBenchmarks
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'JNet PredicateRoundTripBenchmarks (${{ env.LABEL }})'
          tool: 'benchmarkdotnet'
          output-file-path: results/${{ env.LABEL }}/results/MASES.JNetBenchmarksTest.PredicateRoundTripBenchmarks-report-full-compressed.json
          gh-repository: 'github.com/masesgroup/benchmark-data'
          gh-pages-branch: master
          benchmark-data-dir-path: jnet/${{ env.LABEL }}
          github-token: ${{ secrets.WORKFLOW_PERMISSION_PAT }}
          auto-push: true
          alert-threshold: '150%'
          fail-on-alert: false

      - name: Clean benchmark repository directory
        shell: bash
        run: rm -rf ./benchmark-data-repository

      - name: Publish PredicateSustainedBenchmarks
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'JNet PredicateSustainedBenchmarks (${{ env.LABEL }})'
          tool: 'benchmarkdotnet'
          output-file-path: results/${{ env.LABEL }}/results/MASES.JNetBenchmarksTest.PredicateSustainedBenchmarks-report-full-compressed.json
          gh-repository: 'github.com/masesgroup/benchmark-data'
          gh-pages-branch: master
          benchmark-data-dir-path: jnet/${{ env.LABEL }}
          github-token: ${{ secrets.WORKFLOW_PERMISSION_PAT }}
          auto-push: true
          alert-threshold: '150%'
          fail-on-alert: false

  update_doc:
    needs: benchmark
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with: { path: downloaded }

      - name: Assemble benchmark-latest.md
        run: |
          {
            echo "---"
            echo "title: Benchmark results (latest run)"
            echo "---"
            echo ""
            echo "# Benchmark results"
            echo ""
            echo "Auto-generated by [BenchmarkDotNet](https://benchmarkdotnet.org/) on $(date -u +%Y-%m-%d)."
            echo "Do not edit by hand - this file is fully overwritten on every run."
            echo ""
            echo "Live historical dashboard: https://masesgroup.github.io/benchmark-data/jnet/"
            echo ""
            for f in downloaded/bdn-md-*/*-report-github.md; do
              label=$(basename "$(dirname "$f")" | sed 's/^bdn-md-//')
              echo "## $label"
              echo ""
              cat "$f"
              echo ""
            done
          } > src/documentation/articles/benchmark-latest.md

      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.WORKFLOW_PERMISSION_PAT }}
          branch: benchmark-latest-update-${{ github.run_number }}
          commit-message: 'chore(perf): update benchmark-latest.md'
          title: 'Update benchmark-latest.md (run #${{ github.run_number }})'
          body: |
            Auto-generated benchmark tables from BenchmarkDotNet.
            No changes to performance.md - separate, fully regenerated file.
            Full historical trend: https://masesgroup.github.io/benchmark-data/jnet/
          delete-branch: true