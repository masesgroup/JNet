        uses: actions/cache/restore@v6
        with:
          fail-on-cache-miss: true
          enableCrossOsArchive: true
          path: ./bin/
          key: JNet_${{ github.run_number }}_${{ github.run_attempt }}_bin_${{ github.sha }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.x
            10.x

      - name: Set up JDK distribution
        if: ${{ matrix.jdk_vendor != 'graalvm' && matrix.jdk_version != '8' }}
        uses: actions/setup-java@v6
        with: # running setup-java again overwrites the settings.xml
          distribution: ${{ matrix.jdk_vendor }}
          java-version: ${{ matrix.jdk_version }}

      - name: Set up JDK distribution
        if: ${{ matrix.jdk_vendor != 'graalvm' && matrix.jdk_version == '8' }}
        uses: actions/setup-java@v6
        with: # running setup-java again overwrites the settings.xml
          distribution: ${{ matrix.jdk_vendor }}
          java-version: ${{ matrix.jdk_version }}
          java-package: jre

      - name: Set up GraalVM distribution
        if: ${{ matrix.jdk_vendor == 'graalvm' }}
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '${{ matrix.jdk_version }}' # See 'Options' for more details
          distribution: 'graalvm' # See 'Supported distributions' for available options
          github-token: ${{ secrets.GITHUB_TOKEN_INHERITED }}

      - name: Prepare extra argument
        if: matrix.jdk_version == '8'
        shell: bash
        run: echo "EXTRA_ARGUMENT=--JVMDisableOpenOnJavaNio --JVMPath:${{ env.JAVA_HOME }}/lib/amd64/server/libjvm.so" >> $GITHUB_ENV

      - name: Prepare PowerShell extra argument
        if: matrix.jdk_version == '8'
        shell: bash
        run: echo "PS_EXTRA_ARGUMENT=${{ env.JAVA_HOME }}/lib/amd64/server/libjvm.so" >> $GITHUB_ENV

      - name: Prepare PowerShell extra argument
        if: matrix.jdk_version != '8'
        shell: bash
        run: echo "PS_EXTRA_ARGUMENT=${{ env.JAVA_HOME }}" >> $GITHUB_ENV

      - continue-on-error: ${{ inputs.ForceContinueOnError == true }}
        timeout-minutes: 5
        run: dotnet ./bin/${{ matrix.framework }}/JNetPerformanceTest.dll ${{ env.EXTRA_ARGUMENT }}

      - continue-on-error: ${{ inputs.ForceContinueOnError == true }}
        timeout-minutes: 5
        run: dotnet ./bin/${{ matrix.framework }}/JNetTest.dll ${{ env.EXTRA_ARGUMENT }}

      - continue-on-error: ${{ inputs.ForceContinueOnError == true }}
        if: ${{ inputs.EnableAdvancedDiagnostic == true }}
        shell: bash
        run: |
          set +e

          if [ "${{ inputs.UseSpecialSettings }}" == "true" ]; then
            which gdb || sudo apt-get install -y gdb
          fi

          DIAG_JVM_ARGS=""
          if [ "${{ inputs.UseSpecialSettings }}" == "true" ]; then
            DIAG_JVM_ARGS="--JVMOption:-Xlog:gc*,safepoint=debug:stdout:time,uptime,tid"
            echo "::notice::Diagnostic JVM flags enabled: $DIAG_JVM_ARGS"
          fi

          for TEST in TestGetByteArrayDataUsage TestGetByteArrayDataUsageRaw TestGetByteBuffersDataUsage TestGetByteBuffers TestInsertByteBuffers TestInsertByteBuffersNativeStream TestInsertByteBuffersRecyclableMemoryStream; do
            echo "=== Starting $TEST at $(date) ==="
            dotnet ./bin/${{ matrix.framework }}/JNetByteBufferTest.dll $TEST $DIAG_JVM_ARGS ${{ env.EXTRA_ARGUMENT }} &
            PID=$!

            TIMEOUT_SECONDS=300
            DUMP_INTERVAL_SECONDS=60
            ELAPSED=0
            NEXT_DUMP=$DUMP_INTERVAL_SECONDS

            while kill -0 $PID 2>/dev/null; do
              if [ "${{ inputs.UseSpecialSettings }}" == "true" ] && [ $ELAPSED -ge $NEXT_DUMP ] && [ $ELAPSED -lt $TIMEOUT_SECONDS ]; then
                echo "::notice::Periodic dump for $TEST at ${ELAPSED}s"
                jstack -l $PID > "${{ github.workspace }}/threaddump_${TEST}_${{ matrix.jdk_vendor }}_${{ matrix.jdk_version }}_${ELAPSED}s.txt" 2>&1
                sudo gdb -p $PID -batch -ex "thread apply all bt" > "${{ github.workspace }}/nativedump_${TEST}_${{ matrix.jdk_vendor }}_${{ matrix.jdk_version }}_${ELAPSED}s.txt" 2>&1
                NEXT_DUMP=$((NEXT_DUMP + DUMP_INTERVAL_SECONDS))
              fi

              if [ $ELAPSED -ge $TIMEOUT_SECONDS ]; then
                echo "::warning::Process $PID still running after ${TIMEOUT_SECONDS}s - dumping JVM thread state before killing"
                # SIGQUIT makes the embedded JVM print a full thread dump (incl. deadlock detection) to stdout
                kill -QUIT $PID
                sleep 5
                jstack -l $PID > "${{ github.workspace }}/threaddump_${TEST}_${{ matrix.jdk_vendor }}_${{ matrix.jdk_version }}_final.txt" 2>&1
                sudo gdb -p $PID -batch -ex "thread apply all bt" > "${{ github.workspace }}/nativedump_${TEST}_${{ matrix.jdk_vendor }}_${{ matrix.jdk_version }}_final.txt" 2>&1
                sleep 2
                kill -9 $PID 2>/dev/null
                echo "STUCK=true" >> $GITHUB_ENV
                break
              fi
              sleep 2
              ELAPSED=$((ELAPSED + 2))
            done

            wait $PID
          done
          exit $?

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          if-no-files-found: ignore
          name: threaddump_${{ matrix.os }}_${{ matrix.framework }}_${{ matrix.jdk_vendor }}_${{ matrix.jdk_version }}
          path: |
            ${{ github.workspace }}/threaddump_*.txt
            ${{ github.workspace }}/nativedump_*.txt
          retention-days: 7

      - continue-on-error: ${{ inputs.ForceContinueOnError == true }}
        if: ${{ inputs.EnableAdvancedDiagnostic != true }}
        timeout-minutes: 5
        run: |
          for TEST in TestGetByteArrayDataUsage TestGetByteArrayDataUsageRaw TestGetByteBuffersDataUsage TestGetByteBuffers TestInsertByteBuffers TestInsertByteBuffersNativeStream TestInsertByteBuffersRecyclableMemoryStream; do
            echo "=== Starting $TEST at $(date) ==="
            dotnet ./bin/${{ matrix.framework }}/JNetByteBufferTest.dll $TEST ${{ env.EXTRA_ARGUMENT }}
          done

      - shell: pwsh
        run: Register-PSRepository -Name Local_Nuget_Feed -SourceLocation $env:GITHUB_WORKSPACE\bin -PublishLocation $env:GITHUB_WORKSPACE\bin -InstallationPolicy Trusted
        
      - continue-on-error: ${{ inputs.ForceContinueOnError == true }}
        shell: pwsh
        run: |
          Install-Module MASES.JNetPS -Repository Local_Nuget_Feed
          ${{ github.workspace }}/bin/JNetPSTest.ps1 ${{ env.PS_EXTRA_ARGUMENT }}

      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: Crash_tests_${{ matrix.os }}_${{ matrix.framework }}_${{ matrix.jdk_vendor }}_${{ matrix.jdk_version }}
          path: ${{ github.workspace }}/coredump.*
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: Crash_tests_hs_err__${{ matrix.os }}_${{ matrix.framework }}_${{ matrix.jdk_vendor }}_${{ matrix.jdk_version }}
          path: ${{ github.workspace }}/**/hs_err_*
          retention-days: 7

