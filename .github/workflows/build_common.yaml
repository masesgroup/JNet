        jdk_version: ${{ fromJSON(needs.prepare_matrix_data.outputs.matrix_jdk_version) }} # only LTS versions
        exclude:
          - jdk_vendor: corretto
            jdk_version: 8
          - jdk_vendor: microsoft
            jdk_version: 8
          - jdk_vendor: oracle
            jdk_version: 8
          - jdk_vendor: oracle
            jdk_version: 11
          - jdk_vendor: graalvm
            jdk_version: 8
          - jdk_vendor: graalvm
            jdk_version: 11
              
    runs-on: ${{ matrix.os }}
