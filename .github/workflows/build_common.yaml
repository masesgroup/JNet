# This is a basic workflow to help you get started with Actions

name: Common build workflow

# Controls when the action will run. Triggers the workflow on push
# events but only for the master branch
on:
  workflow_call:
    inputs:
      UseSpecialSettings:
        description: 'Use special settings: not available in forks'
        required: false
        default: false
        type: boolean
      SpecialSettingsSource:
        description: 'Name of special settings file: not available in forks'
        required: false
        default: 'source.zip'
        type: string
      EnableAdvancedTestLogging:
        description: 'Enable reports of more logging'
        required: false
        default: false
        type: boolean
      EnableAdvancedDiagnostic:
        description: 'Enable advanced diagnostic around test'
        required: false
        default: false
        type: boolean
      ExecuteOnMoreOSes:
        description: 'Test on more OSes'
        required: false
        default: false
        type: boolean
      ExecuteOnLargerJDKVendorSet:
        description: 'Executes tests on more JDK vendor'
        required: false
        default: false
        type: boolean
      ExecuteOnLargerJDKVersionSet:
        description: 'Executes tests on more JDK version'
        required: false
        default: false
        type: boolean
      EnableLinuxTests:
        description: 'Enable tests in Linux'
        required: false
        default: false
        type: boolean
      EnableWindowsTests:
        description: 'Enable tests in Windows'
        required: false
        default: false
        type: boolean
      EnableMacOSTests:
        description: 'Enable tests in MacOS'
        required: false
        default: false
        type: boolean
      ForceContinueOnError:
        description: 'Force continue-on-error'
        required: false
        default: false
        type: boolean
      EnableProcessDump:
        description: 'Enable .NET process dump'
        required: false
        default: '0'
        type: string
      ProcessDumpType:
        description: '.NET process dump type'
        required: false
        default: '3'
        type: string
      EnableVerboseDiagnosticProcessDump:
        description: 'Enables verbose diagnostic logging of the dump process'
        required: false
        default: '0'
        type: string
    secrets:
      actor:
        required: true
      GITHUB_TOKEN_INHERITED:
        required: true
      JCOBRIDGE_ENCODED:
        required: true
      SFTP_SERVER:
        required: true
      SFTP_USERNAME:
        required: true
      SFTP_PASSWORD:
        required: true
      SFTP_HOST_KEY:
        required: true
      SFTP_KNOWN_HOST:
        required: true        
      FIRST_SPECIAL_SETTINGS_PASSWORD:
        required: true
      SPECIAL_SETTINGS_PASSWORD:
        required: true
        
concurrency:
  group: '${{ github.workflow }}-child-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

# This workflow contains multiple jobs
jobs:
  ## Now run "build_macos_native"
  #build_macos_native:
  #  runs-on: macos-13
  #  # Steps represent a sequence of tasks that will be executed as part of the job
  #  steps:    
  #    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
  #    - uses: actions/checkout@v7
  #      with:
  #        fetch-depth: '1'
  #        submodules: 'true'
  #
  #    - name: Compile CreateVM
  #      run: |
  #        cd ${{ github.workspace }}/tests/native
  #        g++ -I $JAVA_HOME/include -I $JAVA_HOME/include/darwin -L $JAVA_HOME/lib/server -ljvm CreateVM.cpp -o CreateVM.out
  #
  #    - name: Export location
  #      shell: bash
  #      run: echo "DYLD_LIBRARY_PATH=$(echo $JAVA_HOME/lib/server)" >> $GITHUB_ENV
  #
  #    - name: Execute CreateVM
  #      shell: bash
  #      run: |
  #        export
  #        echo "GITHUB_ENV_LD_LIBRARY_PATH=$(echo $JAVA_HOME/lib/server)" >> $GITHUB_ENV
  #        export DYLD_LIBRARY_PATH=/Users/runner/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.13-11/x64/Contents/Home/lib/server
  #        export
  #        ${{ github.workspace }}/tests/native/CreateVM.out

  build_container:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
      contents: read
      attestations: write
      artifact-metadata: write
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:    
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
        with:
          fetch-depth: '1'
          submodules: 'true'

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.x
            10.x

      - name: Install sshpass
        if: ${{ inputs.UseSpecialSettings == true }}
        shell: bash
        timeout-minutes: 3
        run: |
          export DEBIAN_FRONTEND=noninteractive
          which sshpass || sudo apt-get install -y sshpass

      - name: Download ${{ inputs.SpecialSettingsSource }} via SFTP
        if: ${{ inputs.UseSpecialSettings == true }}
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SFTP_KNOWN_HOST }}" >> ~/.ssh/known_hosts
          sshpass -p "${{ secrets.SFTP_PASSWORD }}" sftp -oStrictHostKeyChecking=yes ${{ secrets.SFTP_USERNAME }}@${{ secrets.SFTP_SERVER }}:/source-files/${{ inputs.SpecialSettingsSource }} "${{ github.workspace }}/${{ inputs.SpecialSettingsSource }}"

      - name: Prepare other files
        if: ${{ inputs.UseSpecialSettings == true }}
        shell: bash
        run: |
          7z e "${{ github.workspace }}/${{ inputs.SpecialSettingsSource }}" -o"${{ github.workspace }}/" -p${{ secrets.FIRST_SPECIAL_SETTINGS_PASSWORD }}
          7z x "${{ github.workspace }}/source.info" -o"${{ github.workspace }}/Deploy/" -p${{ secrets.SPECIAL_SETTINGS_PASSWORD }} -y

      - name: List NuGet packages downloaded
        if: ${{ inputs.UseSpecialSettings == true }}
        shell: bash
        run: ls -la ./Deploy/*.nupkg

      - name: Add special repo
        if: ${{ success() && inputs.UseSpecialSettings == true }}
        shell: bash
        run: dotnet nuget add source "${{ github.workspace }}/Deploy/" --name localDeployNuGet

      - name: Pre compile
        run: dotnet build --no-incremental --configuration Release /p:Platform="Any CPU" /p:NoWarn="0108%3B1030%3B0618%3B0612" src/net/JNet/JNet.csproj
        env:
          GITHUB_SIMPLIFIED_GENERATION: true
          
      - name: Set up Apache Maven Central
        uses: actions/setup-java@v6
        with: # running setup-java again overwrites the settings.xml
          distribution: temurin
          java-version: 8
          cache: 'maven'

      - name: Create Jars for JNet
        run: mvn --file ./src/jvm/jnet/pom.xml --no-transfer-progress package
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.actor }}
          password: ${{ secrets.GITHUB_TOKEN_INHERITED }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/jnet

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          file: ./src/container/Dockerfile.linux
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          
      - name: Attest Docker Hub
        uses: actions/attest-build-provenance@v4
        id: attest
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/jnet
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
        
  # Now run "build"
  build:
    # The type of runner that the job will run on
    runs-on: windows-2022

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:   
      # Runs a set of commands using the runners shell
      # Support longpaths
      - name: Support long paths
        run: git config --system core.longpaths true
      
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
        with:
          fetch-depth: '1'
          submodules: 'true'

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.x
            10.x

      - name: Download pscp directly
        if: ${{ inputs.UseSpecialSettings == true }}
        shell: cmd
        run: |
          curl -L -o "%RUNNER_TEMP%\pscp.exe" https://the.earth.li/~sgtatham/putty/latest/w64/pscp.exe

      - name: Download ${{ inputs.SpecialSettingsSource }} via SFTP
        if: ${{ inputs.UseSpecialSettings == true }}
        shell: cmd
        run: |
          %RUNNER_TEMP%\pscp.exe -hostkey "${{ secrets.SFTP_HOST_KEY }}" -pw ${{ secrets.SFTP_PASSWORD }} -batch ${{ secrets.SFTP_USERNAME }}@${{ secrets.SFTP_SERVER }}:/source-files/${{ inputs.SpecialSettingsSource }} "${{ github.workspace }}\${{ inputs.SpecialSettingsSource }}"

      - name: Prepare other files
        if: ${{ inputs.UseSpecialSettings == true }}
        shell: cmd
        run: |
          7z e ${{ github.workspace }}\${{ inputs.SpecialSettingsSource }} -o"${{ github.workspace }}\" -p${{ secrets.FIRST_SPECIAL_SETTINGS_PASSWORD }}
          7z x ${{ github.workspace }}\source.info -o"${{ github.workspace }}\Deploy\" -p${{ secrets.SPECIAL_SETTINGS_PASSWORD }} -y

      - name: List NuGet packages downloaded
        if: ${{ inputs.UseSpecialSettings == true }}
        shell: cmd
        run: dir .\Deploy\*nupkg

      - name: Add special repo
        if: ${{ success() && inputs.UseSpecialSettings == true }}
        run: dotnet nuget add source "${{ github.workspace }}\Deploy\" --name localDeployNuGet

      - name: Pre compile
        run: dotnet build --no-incremental --configuration Release /p:Platform="Any CPU" /p:NoWarn="0108%3B1030%3B0618%3B0612" src\net\JNet\JNet.csproj
        env:
          GITHUB_SIMPLIFIED_GENERATION: true
          
      - name: Set up Apache Maven Central
        uses: actions/setup-java@v6
        with: # running setup-java again overwrites the settings.xml
          distribution: temurin
          java-version: 8
          cache: 'maven'

      - name: Create Jars for JNet
        run: mvn --file ./src/jvm/jnet/pom.xml --no-transfer-progress package
        
      - name: Create Jars for JNetReflector
        run: mvn --file ./src/jvm/jnetreflector/pom.xml --no-transfer-progress package

      - name: Compile JNetCLI
        run: dotnet build --no-incremental --configuration Release /p:Platform="Any CPU" /p:NoWarn="0108%3B1030%3B0618%3B0612" src\net\JNetCLI\JNetCLI.csproj
 
      - name: Compile JNetReflector
        run: dotnet build --no-incremental --configuration Release /p:Platform="Any CPU" /p:NoWarn="0108%3B1030%3B0618%3B0612" src\net\JNetReflector\JNetReflector.csproj
 
      - name: Compile JNetPSCore
        run: dotnet build --no-incremental --configuration Release /p:Platform="Any CPU" /p:NoWarn="0108%3B1030%3B0618%3B0612" src\net\JNetPSCore\JNetPSCore.csproj
        
      - name: Compile JNetPS
        run: dotnet build --no-incremental --configuration Release /p:Platform="Any CPU" /p:NoWarn="0108%3B1030%3B0618%3B0612" src\net\JNetPS\JNetPS.csproj
 
      - uses: nuget/setup-nuget@v4
        with:
          nuget-version: '5.x'
          
      - run: nuget pack src\net\JNetCLI\JNetCLI.nuspec -OutputDirectory .\bin
      - run: nuget pack src\net\JNetReflector\JNetReflector.nuspec -OutputDirectory .\bin

      - name: Prepare PowerShell package
        run: |
          Copy-Item .\src\net\JNetPS\MASES.JNetPS.psd1 -Destination .\MASES.JNetPS\MASES.JNetPS.psd1 -Force
          Copy-Item .\src\net\JNetPS\MASES.JNetPS.psm1 -Destination .\MASES.JNetPS\MASES.JNetPS.psm1 -Force
        shell: pwsh
     
      - name: Create PowerShell package
        run: |
          $env:DOTNET_CLI_UI_LANGUAGE="en_US"
          Register-PSRepository -Name Local_Nuget_Feed -SourceLocation $env:GITHUB_WORKSPACE\bin -PublishLocation $env:GITHUB_WORKSPACE\bin -InstallationPolicy Trusted
          Publish-Module -Path .\MASES.JNetPS -Repository Local_Nuget_Feed -NuGetApiKey 'ABC123'
        shell: pwsh

      - name: Recompile to create nuget packages
        run: dotnet build --no-incremental --configuration Release /p:Platform="Any CPU" /p:NoWarn="0108%3B1030%3B0618%3B0612" src\net\JNet.sln

      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: JNetNuGet
          path: .\bin\*nupkg

      - name: Create Jars for tests
        run: mvn --file ./tests/jvm/jnettest/pom.xml --no-transfer-progress package

      - name: Compile tests and templates
        run: dotnet build --no-incremental --configuration Release /p:Platform="Any CPU" /p:NoWarn="0108%3B1030%3B0618%3B0612" tests\net\JNetTest.sln
        env:
          GITHUB_TEST_PREPARATION: true

      - name: Prepare execution files
        run: |
          Copy-Item ${{ github.workspace }}\tests\scripts\JNetPSTest.ps1 -Destination bin\JNetPSTest.ps1 -Force

      - name: Save JNet bin in cache
        uses: actions/cache/save@v6
        with:
          enableCrossOsArchive: true
          path: ./bin/
          key: JNet_${{ github.run_number }}_${{ github.run_attempt }}_bin_${{ github.sha }}
          
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: JNetBin
          path: .\bin\

  # prepare matrix info
  prepare_matrix_data:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      matrix_jdk_vendor: ${{ steps.set-jdk-vendor.outputs.matrix_jdk_vendor || steps.set-jdk-vendor-ext.outputs.matrix_jdk_vendor }}
      matrix_jdk_version: ${{ steps.set-jdk-version.outputs.matrix_jdk_version || steps.set-jdk-version-ext.outputs.matrix_jdk_version }}
      matrix_win_os: ${{ steps.set-matrix-win-os.outputs.matrix_win || steps.set-matrix-win-os-ext.outputs.matrix_win }}
      matrix_linux_os: ${{ steps.set-matrix-linux-os.outputs.matrix_linux || steps.set-matrix-linux-os-ext.outputs.matrix_linux }}
      matrix_mac_os: ${{ steps.set-matrix-mac-os.outputs.matrix_mac || steps.set-matrix-mac-os-ext.outputs.matrix_mac }}
    steps:
      - id: set-jdk-vendor
        if: ${{ inputs.ExecuteOnLargerJDKVendorSet == false }}
        run: echo "matrix_jdk_vendor=[ 'temurin' ]" >> $GITHUB_OUTPUT
      - id: set-jdk-vendor-ext
        if: ${{ inputs.ExecuteOnLargerJDKVendorSet == true }}
        run: echo "matrix_jdk_vendor=[ 'temurin', 'zulu', 'microsoft', 'corretto', 'oracle' ]" >> $GITHUB_OUTPUT
      - id: set-jdk-version
        if: ${{ inputs.ExecuteOnLargerJDKVersionSet == false }}
        run: echo "matrix_jdk_version=[ '17', '21', '25' ]" >> $GITHUB_OUTPUT
      - id: set-jdk-version-ext
        if: ${{ inputs.ExecuteOnLargerJDKVersionSet == true }}
        run: echo "matrix_jdk_version=[ '8', '11', '17', '21', '25' ]" >> $GITHUB_OUTPUT
      - id: set-matrix-win-os
        if: ${{ inputs.ExecuteOnMoreOSes == false }}
        run: echo "matrix_win=[ 'windows-2025' ]" >> $GITHUB_OUTPUT
      - id: set-matrix-win-os-ext
        if: ${{ inputs.ExecuteOnMoreOSes == true }}
        run: echo "matrix_win=[ 'windows-2022', 'windows-2025', 'windows-11-arm' ]" >> $GITHUB_OUTPUT
      - id: set-matrix-linux-os
        if: ${{ inputs.ExecuteOnMoreOSes == false }}
        run: echo "matrix_linux=['ubuntu-24.04']" >> $GITHUB_OUTPUT
      - id: set-matrix-linux-os-ext
        if: ${{ inputs.ExecuteOnMoreOSes == true }}
        run: echo "matrix_linux=[ 'ubuntu-22.04', 'ubuntu-22.04-arm', 'ubuntu-24.04', 'ubuntu-24.04-arm', 'ubuntu-26.04', 'ubuntu-26.04-arm' ]" >> $GITHUB_OUTPUT
      - id: set-matrix-mac-os
        if: ${{ inputs.ExecuteOnMoreOSes == false }}
        run: echo "matrix_mac=[ 'macos-15' ]" >> $GITHUB_OUTPUT
      - id: set-matrix-mac-os-ext
        if: ${{ inputs.ExecuteOnMoreOSes == true }}
        run: echo "matrix_mac=[ 'macos-14', 'macos-15', 'macos-26', 'macos-26-intel' ]" >> $GITHUB_OUTPUT

  tests_win:
    if: ${{ inputs.EnableWindowsTests == true }}
    needs: prepare_matrix_data
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.prepare_matrix_data.outputs.matrix_win_os) }} # [ 'windows-2022', 'windows-2025', 'windows-11-arm' ]
        framework: [ 'net462', 'net8.0', 'net9.0', 'net10.0' ]
        jdk_vendor: ${{ fromJSON(needs.prepare_matrix_data.outputs.matrix_jdk_vendor) }}
        jdk_version: ${{ fromJSON(needs.prepare_matrix_data.outputs.matrix_jdk_version) }} # only LTS versions
        exclude:
          - os: windows-11-arm
            framework: net462
          - os: windows-11-arm
            jdk_version: 8
          - os: windows-11-arm
            jdk_version: 11
          - os: windows-11-arm
            jdk_version: 17
          - jdk_vendor: microsoft
            jdk_version: 8
          - jdk_vendor: oracle
            jdk_version: 8
          - jdk_vendor: oracle
            jdk_version: 11
          - jdk_vendor: graalvm
            jdk_version: 8
          - jdk_vendor: graalvm
            jdk_version: 11
              
    #     - os: windows-11-arm
    #       jdk_vendor: temurin
    #     - os: windows-11-arm
    #       jdk_vendor: zulu
    #     - os: windows-11-arm
    #       jdk_vendor: microsoft
    #     - os: windows-11-arm
    #       jdk_vendor: corretto
    #     - os: windows-11-arm
    #       jdk_vendor: oracle
    #     - os: windows-11-arm
    #       jdk_vendor: graalvm
            
     
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_DbgEnableMiniDump: ${{ inputs.EnableProcessDump }}
      DOTNET_DbgMiniDumpType: ${{ inputs.ProcessDumpType }}
      DOTNET_DbgMiniDumpName: ${{ github.workspace }}/coredump.%p
      DOTNET_CreateDumpDiagnostics: ${{ inputs.EnableProcessDump }}
      DOTNET_CreateDumpVerboseDiagnostics: ${{ inputs.EnableVerboseDiagnosticProcessDump }}
      DOTNET_EnableCrashReport: ${{ inputs.EnableProcessDump }}
      DOTNET_CreateDumpLogToFile: ${{ github.workspace }}/coredump.diagnostic
      JCOBRIDGE_LicensePath: ${{ secrets.JCOBRIDGE_ENCODED }}
      ENABLE_ADVANCED_TEST_LOGGING: ${{ inputs.EnableAdvancedTestLogging }}
    
    steps:     
      - name: Solved issue using workaround in https://github.com/actions/partner-runner-images/issues/99#issue-3075011959
        if: ${{ matrix.os == 'windows-11-arm' }}
        run: choco install zstandard

      - name: Restore JNet bin from cache
        uses: actions/cache/restore@v6
        with:
          fail-on-cache-miss: true
          enableCrossOsArchive: true
          path: ./bin/
          key: JNet_${{ github.run_number }}_${{ github.run_attempt }}_bin_${{ github.sha }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.x

      - name: Download Procdump and prepare
        if: ${{ inputs.EnableProcessDump }} # see https://gist.github.com/Sedeniono/e6d6504e3bf0645937852ee5681ef9ee and https://learn.microsoft.com/it-it/sysinternals/downloads/procdump
        continue-on-error: true
        run: |
          C:\msys64\usr\bin\wget.exe https://download.sysinternals.com/files/Procdump.zip
          Expand-Archive -LiteralPath '${{ github.workspace }}\Procdump.zip' -DestinationPath ${{ github.workspace }}\Procdump -Force
          dir .\Procdump
          ${{ github.workspace }}\Procdump\procdump.exe -accepteula
          mkdir CrashDumpsDir
          ${{ github.workspace }}\Procdump\procdump.exe -ma -i ${{ github.workspace }}\CrashDumpsDir

      - name: Set up JDK distribution
        if: ${{ matrix.jdk_vendor != 'graalvm' && matrix.jdk_version != '8' }}
        uses: actions/setup-java@v6
        with: # running setup-java again overwrites the settings.xml
          distribution: ${{ matrix.jdk_vendor }}
          java-version: ${{ matrix.jdk_version }}

      - name: Set up JDK distribution
        if: ${{ matrix.jdk_vendor != 'graalvm' && matrix.jdk_version == '8' }}
        uses: actions/setup-java@v6
        with: # running setup-java again overwrites the settings.xml
          distribution: ${{ matrix.jdk_vendor }}
          java-version: ${{ matrix.jdk_version }}
          java-package: jre

      - name: Set up GraalVM distribution
        if: ${{ matrix.jdk_vendor == 'graalvm' }}
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '${{ matrix.jdk_version }}' # See 'Options' for more details
          distribution: 'graalvm' # See 'Supported distributions' for available options
          github-token: ${{ secrets.GITHUB_TOKEN_INHERITED }}

      - name: Prepare extra argument
        if: matrix.jdk_version == '8'
        shell: bash
        run: echo "EXTRA_ARGUMENT=--JVMDisableOpenOnJavaNio" >> $GITHUB_ENV

      - name: Prepare PowerShell extra argument
        shell: bash
        run: echo "PS_EXTRA_ARGUMENT=${{ env.JAVA_HOME }}" >> $GITHUB_ENV

      - if: ${{ matrix.framework != 'net462' }} # for windows see https://github.com/masesgroup/JNet/issues/573#issuecomment-2550033900
        continue-on-error: ${{ inputs.ForceContinueOnError == true }}
        timeout-minutes: 5
        run: dotnet ./bin/${{ matrix.framework }}/JNetPerformanceTest.dll ${{ env.EXTRA_ARGUMENT }}

      - if: ${{ matrix.framework != 'net462' }} # for windows see https://github.com/masesgroup/JNet/issues/573#issuecomment-2550033900
        continue-on-error: ${{ inputs.ForceContinueOnError == true }}
        timeout-minutes: 5
        run: dotnet ./bin/${{ matrix.framework }}/JNetTest.dll ${{ env.EXTRA_ARGUMENT }}

      - if: ${{ matrix.framework != 'net462' }} # for windows see https://github.com/masesgroup/JNet/issues/573#issuecomment-2550033900
        continue-on-error: ${{ inputs.ForceContinueOnError == true }}
        timeout-minutes: 5
        shell: bash
        run: |
          for TEST in TestGetByteArrayDataUsage TestGetByteArrayDataUsageRaw TestGetByteBuffersDataUsage TestGetByteBuffers TestInsertByteBuffers TestInsertByteBuffersNativeStream TestInsertByteBuffersRecyclableMemoryStream; do
            dotnet ./bin/${{ matrix.framework }}/JNetByteBufferTest.dll $TEST ${{ env.EXTRA_ARGUMENT }}
          done

      - if: ${{ matrix.framework == 'net462' }}
        continue-on-error: ${{ inputs.ForceContinueOnError == true }}
        timeout-minutes: 5
        run: .\bin\${{ matrix.framework }}\JNetPerformanceTest.exe ${{ env.EXTRA_ARGUMENT }}

      - if: ${{ matrix.framework == 'net462' }}
        continue-on-error: ${{ inputs.ForceContinueOnError == true }}
        timeout-minutes: 5
        run: .\bin\${{ matrix.framework }}\JNetTest.exe ${{ env.EXTRA_ARGUMENT }}

      - if: ${{ matrix.framework == 'net462' }}
        continue-on-error: ${{ inputs.ForceContinueOnError == true }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          foreach ($TEST in @(
              'TestGetByteArrayDataUsage',
              'TestGetByteArrayDataUsageRaw',
              'TestGetByteBuffersDataUsage',
              'TestGetByteBuffers',
              'TestInsertByteBuffers',
              'TestInsertByteBuffersNativeStream',
              'TestInsertByteBuffersRecyclableMemoryStream'
          )) {
            .\bin\${{ matrix.framework }}\JNetByteBufferTest.exe $TEST ${{ env.EXTRA_ARGUMENT }}
          }

      - shell: pwsh
        run: Register-PSRepository -Name Local_Nuget_Feed -SourceLocation $env:GITHUB_WORKSPACE\bin -PublishLocation $env:GITHUB_WORKSPACE\bin -InstallationPolicy Trusted

      - name: Disable CET for pwsh process
        shell: pwsh
        run: |
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\pwsh.exe" /v MitigationOptions /t REG_BINARY /d "0000000000000000000000000000002000" /f
          Get-ProcessMitigation -Name "pwsh.exe"

      - continue-on-error: ${{ inputs.ForceContinueOnError == true }}
        shell: pwsh
        run: |
          Install-Module MASES.JNetPS -Repository Local_Nuget_Feed
          ${{ github.workspace }}\bin\JNetPSTest.ps1 ${{ env.PS_EXTRA_ARGUMENT }}

