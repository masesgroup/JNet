# This is a basic workflow to help you get started with Actions

name: CI_GENERATECLASSES

# Controls when the action will run. Triggers the workflow on push
# events but only for the master branch
on:
  workflow_dispatch:
    inputs:
      GeneratePR:
        description: 'Generate the PR at the end'
        required: true
        default: false
        type: boolean
      AvoidParallelBuild:
        description: 'Avoid parallel build'
        required: false
        default: false
        type: boolean
      TraceToFile:
        description: 'Generate trace output to file'
        required: false
        default: true
        type: boolean
      TraceLevel:
        description: 'Trace level to report'
        required: false
        default: '1'
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

# This workflow contains one job called "build_documentation"
jobs:
  build_classes:
    # The type of runner that the job will run on
    runs-on: windows-2022
    env:
      DOTNET_DbgEnableMiniDump: 1
      DOTNET_DbgMiniDumpType: 3
      DOTNET_DbgMiniDumpName: ${{ github.workspace }}/coredump.%p
      DOTNET_CreateDumpDiagnostics: 1
      DOTNET_CreateDumpVerboseDiagnostics: 1
      DOTNET_EnableCrashReport: 1
      JCOBRIDGE_LicensePath: ${{ secrets.JCOBRIDGE_ENCODED_2_6_7 }}
      
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Runs a set of commands using the runners shell
      # Support longpaths
      - name: Support long paths
        run: git config --system core.longpaths true
      
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6
        with:
          fetch-depth: '1'
          submodules: 'true'

      - name: Prebuild
        run: dotnet build --no-incremental --configuration Release src\net\JNetReflector\JNetReflector.csproj

      - name: Set up Apache Maven Central
        uses: actions/setup-java@v5
        with: # running setup-java again overwrites the settings.xml
          distribution: temurin
          java-version: 8
          cache: 'maven'
  
      - name: Create Jars for JNetReflector
        run: mvn "-DbinFolderName=binReflector" --file ./src/jvm/jnetreflector/pom.xml --no-transfer-progress package

      - name: Clear C# generated files
        run: Remove-Item .\src\net\JNet\Generated\* -Recurse -Force -Exclude README.md,.editorconfig

      - name: Clear Java generated files
        run: Remove-Item .\src\jvm\jnet\src\main\java\org\mases\jnet\generated\* -Recurse -Force -Exclude README.md

      - run: dotnet build --no-incremental --configuration Release src\net\JNetReflector\JNetReflector.csproj

      - name: Set up Apache Maven Central
        uses: actions/setup-java@v5
        with: # running setup-java again overwrites the settings.xml
          distribution: temurin
          java-version: 8
          java-package: jre
          cache: 'maven'

      - name: Set trace to file
        if: ${{ inputs.TraceToFile == true }}
        run: |
          echo "TRACE_TO_FILE=$(echo -TraceTo %GITHUB_WORKSPACE%\JNetReflector.txt)" >> $GITHUB_ENV
        shell: bash

      - name: Set avoid parallel build
        if: ${{ inputs.AvoidParallelBuild == true }}
        run: |
          echo "AVOID_PARALLEL_BUILD=$(echo -AvoidParallelBuild)" >> $GITHUB_ENV
        shell: bash

      - name: Build classes
        shell: cmd
        run: |
          cd binReflector\net8.0
          MASES.JNetReflector.exe --JVMDisableOpenOnJavaNio ${{ env.AVOID_PARALLEL_BUILD }} -TraceLevel ${{ inputs.TraceLevel }} ${{ env.TRACE_TO_FILE }} -OriginRootPath %JAVA_HOME_8_X64%\lib -DestinationRootPath %GITHUB_WORKSPACE%\src\ -ConfigurationFile %GITHUB_WORKSPACE%\src\configuration.json

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.TraceToFile == true }}
        with:
          name: JNetReflector report
          path: .\JNetReflector.txt

      - name: Set up Apache Maven Central
        uses: actions/setup-java@v5
        with: # running setup-java again overwrites the settings.xml
          distribution: temurin
          java-version: 8
          cache: 'maven'

      - name: Try Java compilation
        continue-on-error: true
        run: mvn "-DbinFolderName=binReflector" --file ./src/jvm/jnet/pom.xml --no-transfer-progress package

      - name: Try C# compilation
        continue-on-error: true
        run: dotnet build --no-incremental --configuration Release /p:Platform="Any CPU" /p:NoWarn="0108%3B1030%3B0618" src\net\JNet.sln
 
      - name: Extract commit SHA
        if: ${{ inputs.GeneratePR == true }}
        run: |
          echo "GITHUB_COMMIT_MESSAGE=$(echo $GITHUB_SHA | cut -c 1-7)" >> $GITHUB_ENV
        shell: bash

      - name: Request a PR to commit changes
        if: ${{ inputs.GeneratePR == true }}
        uses: peter-evans/create-pull-request@v8
        with:
          branch-suffix: short-commit-hash
          add-paths: src/*.*
          commit-message: Update generated classes after commit ${{ env.GITHUB_COMMIT_MESSAGE }}
          title: Update generated classes after commit ${{ env.GITHUB_COMMIT_MESSAGE }}
          body: |
            Automated changes by GitHub action, fix #216
          reviewers: masesdevelopers
          assignees: masesdevelopers
          labels: java, .NET, enhancement 
